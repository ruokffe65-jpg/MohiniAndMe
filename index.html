<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mohini ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hearts"></div>

<div class="container">

    <h1>Hi Mohini ❤️</h1>

    <p class="subtitle">
        Every star in this sky reminds me of you.
    </p>

    <div class="timer">
        <h2>❤️ Together Since ❤️</h2>
        <div id="loveTimer">Loading...</div>
    </div>

    <button id="heartButton">
        ❤️ Enter Our Universe
    </button>

    <section class="gallery">

        <h2>📸 Our Beautiful Memories</h2>

        <div class="photo-grid">

            <div class="photo">
                <img src="images/IMG_2741.JPG" alt="Our Butterfly Memory">
                <div class="caption">
                    🦋 The little butterfly on my collar made you smile and blush.
                    It turned an ordinary walk into one of my favorite memories with you.
                </div>
            </div>

            <div class="photo">Photo 2</div>
            <div class="photo">Photo 3</div>
            <div class="photo">Photo 4</div>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
